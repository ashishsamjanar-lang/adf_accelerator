name: adf-accelerator

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./config/platform.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    # Local-dev-only hot reload; the image's own CMD (backend/Dockerfile) omits
    # --reload because CI/CD ships that same image to Container Apps as-is.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - ./config/platform.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    env_file:
      - ./config/platform.env
    volumes:
      - ./worker:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Dockerfile's default (last) stage is `production` — a real build
      # meant for CI/CD (gap B-2). Local dev explicitly opts into the dev
      # server stage instead.
      target: dev
    env_file:
      - ./config/platform.env
    environment:
      # Server-side only (never NEXT_PUBLIC_*) — resolved per-request by
      # frontend/middleware.ts, never baked into the client bundle
      #.
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
