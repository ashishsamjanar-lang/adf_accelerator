{{/*
Only rendered when secrets.create is true (values.yaml's Option A — quick
eval installs). For production, set secrets.existingSecret instead and this
template renders nothing; the app containers reference the Secret by name
either way via adf-accelerator.secretName (templates/_helpers.tpl).
*/}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adf-accelerator.secretName" . }}
  labels:
    {{- include "adf-accelerator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.keys.gitTokenFernetKey }}: {{ .Values.secrets.gitTokenFernetKey | quote }}
  {{ .Values.secrets.keys.gitToken }}: {{ .Values.secrets.gitToken | quote }}
{{- end -}}
