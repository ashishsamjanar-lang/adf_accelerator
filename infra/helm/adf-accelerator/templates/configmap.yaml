apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adf-accelerator.fullname" . }}-config
  labels:
    {{- include "adf-accelerator.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  DB_POOL_SIZE: {{ .Values.config.dbPoolSize | quote }}
  DB_MAX_OVERFLOW: {{ .Values.config.dbMaxOverflow | quote }}
  BACKEND_INTERNAL_URL: "http://{{ include "adf-accelerator.fullname" . }}-backend:{{ .Values.backend.service.port }}"
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
