apiVersion: v1
kind: Service
metadata:
  name: {{ include "adf-accelerator.fullname" . }}-backend
  labels:
    {{- include "adf-accelerator.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "adf-accelerator.componentSelectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
