[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-accelerator-api"
version = "0.1.0"
description = "API foundation for the ADF Pipeline Accelerator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "cryptography>=43,<44",
  # STTM Silver/Gold workbook parsing (AGENTS.md §33.9) — authoritative
  # server-side re-parse/validate of an uploaded .xlsx, independent of the
  # frontend's client-side preview parser (frontend uses `exceljs` instead).
  "openpyxl>=3.1,<4",
  # multipart/form-data parsing — FastAPI's UploadFile (sttm-import) needs it.
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
