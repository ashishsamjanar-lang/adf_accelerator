name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp config/platform.env.example config/platform.env
          docker compose config
      - name: Build backend image
        run: docker build ./backend
      - name: Build worker image
        run: docker build ./worker
      - name: Build frontend image
        run: docker build ./frontend

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + test deps (pinned)
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: pytest -q

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker + test deps (pinned)
        working-directory: worker
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: pytest
        working-directory: worker
        run: pytest -q

  # Runs the parity test (frontend pipeline-codegen.ts vs worker codegen.py)
  # as its own job because it needs Node for the frontend generator half —
  # see worker/tests/test_generator_parity.py for how the two are bridged.
  generator-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install worker + test deps (pinned)
        working-directory: worker
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run parity test
        working-directory: worker
        run: pytest -q tests/test_generator_parity.py

  # A real Postgres, only for the migration-drift check below — every other
  # backend test runs against in-memory SQLite (backend/tests/conftest.py)
  # and needs no external service.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accelerator
          POSTGRES_USER: accelerator
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accelerator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://accelerator:ci-only@localhost:5432/accelerator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (pinned)
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt
      - name: alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      - name: Fail if models.py and the migrations have drifted
        working-directory: backend
        run: |
          alembic revision --autogenerate -m "ci_drift_check" --rev-id ci_drift_check
          diff="$(git status --porcelain alembic/versions)"
          if [ -n "$diff" ]; then
            echo "::error::alembic autogenerate produced a non-empty migration — a model changed without a matching migration:"
            cat "alembic/versions/"*ci_drift_check*.py
            exit 1
          fi

  # Proves the committed lock files (requirements*.txt) actually resolve and install
  # cleanly and that the app still imports against those exact pins — the same lock
  # Dockerfile/deploy.yml bakes into the shipped image. Catches a bad/stale pin here,
  # pre-merge, instead of at image-build or deploy time.
  backend-requirements-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps
        working-directory: backend
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: pip check (no unmet/conflicting requirements)
        working-directory: backend
        run: pip check
      - name: Import the app against the pinned lock
        working-directory: backend
        run: python -c "import app.main"

  worker-requirements-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned deps
        working-directory: worker
        run: pip install --no-cache-dir -r requirements-dev.txt
      - name: pip check (no unmet/conflicting requirements)
        working-directory: worker
        run: pip check
      - name: Import the app against the pinned lock
        working-directory: worker
        run: python -c "import app.main"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  frontend-e2e:
    # Browser happy path (Build → Generate → Validate) against the real Next.js app; the API is stubbed
    # in-browser by e2e/support/api-stub.ts, so no backend/Postgres service is needed here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  helm-chart:
    # Lint + render the cloud-agnostic chart so a template error fails CI instead of the first real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/adf-accelerator
      - run: helm template adf-accelerator infra/helm/adf-accelerator > /dev/null
