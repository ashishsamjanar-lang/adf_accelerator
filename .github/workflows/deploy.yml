name: Deploy

# CD for the ADF Forge *application* (frontend/backend/worker) — separate
# from ci.yml, which only builds/tests. Has
# nothing to do with, and never touches, a customer's Azure Data Factory
# factory or the Generated Artifacts repo (§20/§23.7).
#
# Images: pushed to GitHub Container Registry (ghcr.io) using the workflow's
# own GITHUB_TOKEN — no separate registry or its cost (gap B-6, "lowest cost").
# Auth to Azure: OIDC federated credential (azure/login), no stored client
# secret to rotate or leak.
#
# Promotion model: build once, promote the same image digest/tag through
# dev -> qa -> prod (gap B-6/B-3) — never rebuilt per environment, so the
# same production image that ran in dev is exactly what reaches prod.
#
# Required per-environment setup (GitHub Settings > Environments — this is
# also where qa/prod approval gates belong; configure them there, not here):
#   Environment variables: AZURE_RESOURCE_GROUP, AZURE_KEY_VAULT_NAME,
#     AZURE_CONTAINER_REGISTRY_USERNAME
#   Environment secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     (federated OIDC identity — see azure/login's docs for the
#     federated-credential setup, no client secret needed)
#
# This workflow has not been run against a real Azure subscription or GitHub
# Environments as part of authoring it — validate the `az deployment group
# what-if` step's output before trusting the deploy step in each environment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (must match a configured GitHub Environment)"
        type: choice
        options: [dev, qa, prod]
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write # required for azure/login's OIDC federated credential

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build + push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BASE }}-backend:${{ steps.tag.outputs.tag }}
      - name: Build + push worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ${{ env.IMAGE_BASE }}-worker:${{ steps.tag.outputs.tag }}
      - name: Build + push frontend (production target — see frontend/Dockerfile, gap B-2)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ env.IMAGE_BASE }}-frontend:${{ steps.tag.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (review before applying)
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          deploymentMode: Incremental
          additionalArguments: --what-if
          parameters: >
            environment=${{ inputs.environment || 'dev' }}
            keyVaultName=${{ vars.AZURE_KEY_VAULT_NAME }}
            containerRegistryUsername=${{ vars.AZURE_CONTAINER_REGISTRY_USERNAME }}
            backendImage=${{ env.IMAGE_BASE }}-backend
            workerImage=${{ env.IMAGE_BASE }}-worker
            frontendImage=${{ env.IMAGE_BASE }}-frontend
            imageTag=${{ needs.build-and-push.outputs.tag }}
      - name: Deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          deploymentMode: Incremental
          parameters: >
            environment=${{ inputs.environment || 'dev' }}
            keyVaultName=${{ vars.AZURE_KEY_VAULT_NAME }}
            containerRegistryUsername=${{ vars.AZURE_CONTAINER_REGISTRY_USERNAME }}
            backendImage=${{ env.IMAGE_BASE }}-backend
            workerImage=${{ env.IMAGE_BASE }}-worker
            frontendImage=${{ env.IMAGE_BASE }}-frontend
            imageTag=${{ needs.build-and-push.outputs.tag }}
      # No separate migration step: backend/docker-entrypoint.sh runs
      # `alembic upgrade head` before the API starts serving traffic on every
      # container start (§23.12 gap #18) — the new revision above already
      # applies migrations on its own.
